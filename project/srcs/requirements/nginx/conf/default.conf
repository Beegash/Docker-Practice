# NGINX server configuration for WordPress with PHP-FPM
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iozmen.42.fr www.iozmen.42.fr;

    root /var/www/html;
    index index.php index.html index.htm;

    # SSL Configuration
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    
    # SSL Protocols (TLSv1.2 ve TLSv1.3 - Inception gereksinimi)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    keepalive_timeout 70;

    # Client max body size (dosya yüklemeleri için)
    client_max_body_size 100M;

    # WordPress permalink yapısı için
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPM ile iletişim
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_buffering off;
    }

    # WordPress güvenlik ayarları
    location ~ /\.ht {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # Static dosyalar için cache
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Access ve Error logları
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
